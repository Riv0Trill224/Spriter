plugins { id 'com.android.application' }

android {
    namespace 'com.riv0trill.spriter'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.riv0trill.spriter'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }

tasks.register('verifyPokemonPack') {
    doLast {
        def pack = file('src/main/assets/pokemon')
        if ((1..151).any { !new File(pack, "${it}.png").isFile() }) {
            throw new GradleException('Falta la colección Pokémon. Ejecuta: python3 scripts/fetch_pokemon.py')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyPokemonPack' }
