plugins { id 'com.android.application' }

def signingPath = System.getenv('RGDS_KEYSTORE_PATH')

android {
    namespace 'com.riv0trill.spriter'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.riv0trill.spriter'
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (signingPath) {
            stable {
                storeFile file(signingPath)
                storePassword System.getenv('RGDS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RGDS_KEY_ALIAS')
                keyPassword System.getenv('RGDS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { if (signingPath) signingConfig signingConfigs.stable }
    }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }

tasks.register('verifyPokemonPack') {
    doLast {
        def pack = file('src/main/assets/pokemon')
        if ((1..151).any { !new File(pack, "${it}.png").isFile() }) {
            throw new GradleException('Falta la colección Pokémon. Ejecuta: python3 scripts/fetch_pokemon.py')
        }
        def custom = file('src/main/assets/custom')
        if ((1..154).any { !new File(custom, "${it}.png").isFile() }) {
            throw new GradleException('Falta la colección personalizada de 154 sprites.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyPokemonPack' }
